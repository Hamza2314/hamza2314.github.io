<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hamza Masri — AI Engineer and DevOps Specialist</title>
    <meta name="description" content="AI Engineer and DevOps Specialist in Rostock, Germany. Production AI systems and the Kubernetes infrastructure that runs them." />
    <meta property="og:title" content="Hamza Masri — AI Engineer and DevOps Specialist" />
    <meta property="og:description" content="Production AI systems and the Kubernetes infrastructure that runs them." />
    <meta property="og:type" content="website" />
    <!--
      The portrait is the LCP element, so it is fetched at the highest priority
      and never lazy-loaded. Only the AVIF set is preloaded: preloading both
      formats would make AVIF-capable browsers download the image twice, and
      anything without AVIF support skips this on the type and picks up the
      WebP from <picture> as normal.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 769px)"
      imagesrcset="/hero-420.avif 420w, /hero-570.avif 570w"
      imagesizes="38vw"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 768px)"
      imagesrcset="/hero-t-420.avif 420w, /hero-t-550.avif 550w"
      imagesizes="76vw"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Marks that scripting is available. The name's reveal animation starts
      // from a clipped, off-screen state, so that state must only ever exist
      // when there is JavaScript around to finish it. Without this the
      // prerendered heading would stay invisible.
      document.documentElement.classList.add('js')
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
